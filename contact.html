<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact FuzeStore</title>

    <style>
        body {
            background: #121212;
            color: white;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        form {
            max-width: 400px;
            margin: 30px auto;
            background: #222222;
            padding: 20px;
            border-radius: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #555555;
            border-radius: 6px;
            background: #333333;
            color: white;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #ff9800;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Contact FuzeStore</h1>

    <form id="contactForm">

        <label for="customerName">Your Name</label>

        <input
            type="text"
            id="customerName"
            placeholder="Enter your name"
            required>

        <label for="customerEmail">Email Address</label>

        <input
            type="email"
            id="customerEmail"
            placeholder="Enter your email"
            required>

        <label for="customerMessage">Your Message</label>

        <textarea
            id="customerMessage"
            rows="5"
            placeholder="Write your message"
            required></textarea>

        <button type="submit">Submit</button>

    </form>

    <script>
        document.getElementById("contactForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("Thank you for contacting FuzeStore!");

            });
    </script>

</body>
</html>
